<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藥學部問卷回饋與溫度監控系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Loading 遮罩 -->
  <div class="loading-overlay" id="loading"><div class="spinner-border text-primary" role="status"></div></div>

  <!-- 登入頁 -->
  <div id="login-page" class="page-view active container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow">
          <div class="card-body p-5">
            <h3 class="text-center mb-4">系統登入</h3>
            <input type="text" id="login-emp-id" class="form-control mb-3" placeholder="請輸入員工編號">
            <button class="btn btn-primary w-100" onclick="app.login()">登入</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 系統主畫面 -->
  <div id="main-system" class="page-view" style="display:none;">
    <div id="wrapper">
      <!-- 側邊欄 -->
      <nav id="sidebar">
        <div class="sidebar-header text-center">
          <h5>藥學部系統</h5>
          <small id="user-info" class="text-muted"></small>
        </div>
        <ul class="list-unstyled components">
          <li class="active"><a href="#" onclick="app.loadDashboard()"><i class="bi bi-house-door"></i> 首頁 (總覽)</a></li>
          <div id="dept-menu-container"></div>
        </ul>
      </nav>

      <!-- 右側內容 -->
      <div id="content">
        <!-- 頂部導覽 -->
        <nav class="navbar navbar-light px-3 mb-4 rounded shadow-sm bg-white">
          <div class="d-flex w-100 justify-content-between align-items-center">
            <button type="button" id="sidebarCollapse" class="btn btn-outline-secondary" onclick="app.toggleSidebar()">
              <i class="bi bi-list"></i>
            </button>
            <div class="d-flex align-items-center">
              <label class="me-2 mb-0 fw-bold">日期:</label>
              <input type="date" id="global-date" class="form-control form-control-sm" onchange="app.refreshCurrentPage()">
            </div>
          </div>
        </nav>

        <!-- 首頁總覽區 -->
        <div id="view-dashboard" class="content-view active">
          <h4 class="mb-4">系統總覽</h4>
          <div class="row">
            <!-- 異常卡片 -->
            <div class="col-md-6 mb-3">
              <div class="card bg-danger text-white shadow-sm h-100">
                <div class="card-header border-0"><i class="bi bi-exclamation-triangle"></i> 異常待處理 <span class="badge bg-light text-danger float-end" id="dash-exc-count">0</span></div>
                <div class="card-body">
                  <ul id="dash-exc-list" class="list-unstyled mb-0" style="max-height: 150px; overflow-y: auto;"></ul>
                </div>
              </div>
            </div>
            <!-- 未完成卡片 -->
            <div class="col-md-6 mb-3">
              <div class="card bg-warning text-dark shadow-sm h-100">
                <div class="card-header border-0"><i class="bi bi-clock-history"></i> 未完成問卷清單</div>
                <div class="card-body">
                  <ul id="dash-inc-list" class="list-unstyled mb-0" style="max-height: 150px; overflow-y: auto;"></ul>
                </div>
              </div>
            </div>
          </div>
          <!-- 溫度圖表區 -->
          <h5 class="mt-4"><i class="bi bi-graph-up"></i> 本日溫度監控折線圖</h5>
          <div id="dash-charts" class="row mt-2"></div>
        </div>

        <!-- 單位問卷清單區 -->
        <div id="view-dept-flows" class="content-view">
          <h4 id="dept-title" class="mb-4"></h4>
          <div class="list-group" id="dept-flow-list"></div>
        </div>

        <!-- 問卷填寫區 -->
        <div id="view-form" class="content-view">
          <button class="btn btn-secondary btn-sm mb-3" onclick="app.goBack()">← 返回清單</button>
          <h4 id="form-title" class="mb-4"></h4>
          <div id="form-container"></div>
          <button id="btn-submit-form" class="btn btn-success w-100 mt-4" onclick="app.submitForm()">送出問卷</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 動作選擇 Modal -->
  <div class="modal fade" id="actionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">選擇動作</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body d-grid gap-2">
          <button class="btn btn-outline-primary" onclick="app.openForm('refill')">建立新紀錄 (再次填寫)</button>
          <button class="btn btn-outline-warning" onclick="app.openForm('edit')">修改此紀錄</button>
          <button class="btn btn-outline-secondary" onclick="app.openForm('view')">僅瀏覽紀錄</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
