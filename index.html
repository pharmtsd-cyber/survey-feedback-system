<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問卷回饋與溫度監控系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- 登入頁 -->
  <div id="login-page" class="page-view active container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow">
          <div class="card-body p-5">
            <h3 class="text-center mb-4">系統登入</h3>
            <input type="text" id="login-emp-id" class="form-control mb-3" placeholder="請輸入員工編號">
            <button class="btn btn-primary w-100" onclick="app.login()">登入</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 系統主畫面 (Sidebar + Content) -->
  <div id="main-system" class="page-view" style="display:none;">
    <div id="wrapper">
      <!-- 左側選單 -->
      <nav id="sidebar">
        <div class="sidebar-header">
          <h4>藥學部系統</h4>
          <small id="user-info"></small>
        </div>
        <ul class="list-unstyled components">
          <li><a onclick="app.loadDashboard()"><i class="bi bi-house-door"></i> 首頁 (總覽)</a></li>
          <!-- 單位選單動態產生 -->
          <div id="dept-menu-container"></div>
        </ul>
      </nav>

      <!-- 右側主內容 -->
      <div id="content">
        <!-- 頂部導覽列 (漢堡選單) -->
        <nav class="navbar navbar-expand-lg navbar-light px-3">
          <button type="button" id="sidebarCollapse" class="btn btn-outline-secondary" onclick="app.toggleSidebar()">
            <i class="bi bi-list"></i>
          </button>
          <div class="ms-auto d-flex align-items-center">
            <input type="date" id="global-date" class="form-control form-control-sm me-3" onchange="app.refreshCurrentPage()">
          </div>
        </nav>

        <!-- 首頁總覽區 -->
        <div id="view-dashboard" class="page-view active">
          <div class="row">
            <div class="col-md-6 mb-3">
              <div class="card bg-danger text-white shadow-sm">
                <div class="card-body">
                  <h5><i class="bi bi-exclamation-triangle"></i> 異常待處理 <span class="badge bg-light text-danger float-end" id="dash-exc-count">0</span></h5>
                  <ul id="dash-exc-list" class="mt-3 list-unstyled"></ul>
                </div>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="card bg-warning text-dark shadow-sm">
                <div class="card-body">
                  <h5><i class="bi bi-clock-history"></i> 未完成清單</h5>
                  <ul id="dash-inc-list" class="mt-3 list-unstyled"></ul>
                </div>
              </div>
            </div>
          </div>
          <!-- 溫度圖表區 -->
          <div id="dash-charts" class="row mt-4"></div>
        </div>

        <!-- 單位問卷清單區 -->
        <div id="view-dept-flows" class="page-view">
          <h4 id="dept-title" class="mb-4"></h4>
          <div class="list-group" id="dept-flow-list"></div>
        </div>

        <!-- 問卷填寫區 -->
        <div id="view-form" class="page-view">
          <button class="btn btn-secondary btn-sm mb-3" onclick="app.goBack()">← 返回</button>
          <h4 id="form-title" class="mb-4"></h4>
          <div id="form-container"></div>
          <button id="btn-submit-form" class="btn btn-success w-100 mt-4" onclick="app.submitForm()">送出問卷</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 動作選擇 Modal (再次填寫/修改/瀏覽) -->
  <div class="modal fade" id="actionModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">選擇動作</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body d-grid gap-2">
          <button class="btn btn-outline-primary" onclick="app.openForm('refill')">建立新紀錄 (再次填寫)</button>
          <button class="btn btn-outline-warning" onclick="app.openForm('edit')">修改此紀錄</button>
          <button class="btn btn-outline-secondary" onclick="app.openForm('view')">僅瀏覽紀錄</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
