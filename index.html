<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藥學部問卷與溫度監控系統</title>
  <!-- 引入 Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #f8f9fa; }
    .page { display: none; }
    .page.active { display: block; }
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <!-- 載入中動畫 -->
  <div class="loading-overlay" id="loading"><div class="spinner-border text-primary" role="status"></div></div>

  <!-- 1. 登入頁面 -->
  <div id="login-page" class="page active container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title text-center mb-4">系統登入</h3>
            <div class="mb-3">
              <label class="form-label">員工編號</label>
              <input type="text" id="login-emp-id" class="form-control" placeholder="請輸入編號 (例: 13598)">
            </div>
            <div class="mb-4">
              <label class="form-label">所在單位</label>
              <select id="login-dept" class="form-select">
                <option value="藥品調劑科">藥品調劑科</option>
                <option value="門診藥局">門診藥局</option>
                <option value="通用">通用</option>
              </select>
            </div>
            <button class="btn btn-primary w-100" onclick="handleLogin()">登入</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 總覽首頁 (Dashboard) -->
  <div id="dashboard-page" class="page container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
      <h4 id="user-info-display"></h4>
      <button class="btn btn-outline-secondary btn-sm" onclick="showChangeUserModal()">更改登入者</button>
    </div>
    
    <div class="row">
      <div class="col-12">
        <h5>今日任務清單</h5>
        <div class="list-group" id="flow-list">
          <!-- JS 動態生成 Flow 清單 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 問卷填寫頁面 -->
  <div id="flow-page" class="page container mt-4">
    <button class="btn btn-secondary btn-sm mb-3" onclick="switchPage('dashboard-page')">← 返回總覽</button>
    <h3 id="flow-title" class="mb-4"></h3>
    <form id="question-form">
      <div id="questions-container"></div>
      <button type="button" class="btn btn-success w-100 mt-4" onclick="submitFlow()">送出問卷</button>
    </form>
  </div>

  <!-- 更改登入者 Modal -->
  <div class="modal fade" id="changeUserModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">切換使用者</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="switch-emp-id" class="form-control" placeholder="請輸入新的員工編號">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick="switchUser()">確認切換</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ==========================================
    // 參數設定 (請替換為你的 GAS 網址)
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzB4n24LjIVF316LDnGTkxFDe7byn17vgrpHU_lQEeZww8iR8K7qLDCj4e2NOdm_ulCBw/exec"; 
    
    let currentUser = {};
    let currentFlowId = "";
    let currentQuestions = [];
    let charts = {}; // 記錄圖表實例以避免重複渲染錯誤

    // ==========================================
    // 共用功能
    // ==========================================
    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }

    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    async function callAPI(payload) {
      showLoading(true);
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const res = await response.json();
        showLoading(false);
        if (!res.success) throw new Error(res.error);
        return res.data;
      } catch (error) {
        showLoading(false);
        alert("系統錯誤: " + error.message);
        throw error;
      }
    }

    // ==========================================
    // 登入與切換使用者
    // ==========================================
    async function handleLogin() {
      const empId = document.getElementById('login-emp-id').value;
      const dept = document.getElementById('login-dept').value;
      if (!empId) return alert("請輸入員工編號");

      const userData = await callAPI({ action: 'login', empId: empId });
      currentUser = { empId: userData.empId, empName: userData.empName, department: dept };
      
      loadDashboard();
    }

    function showChangeUserModal() {
      new bootstrap.Modal(document.getElementById('changeUserModal')).show();
    }

    async function switchUser() {
      const empId = document.getElementById('switch-emp-id').value;
      if (!empId) return alert("請輸入員工編號");
      const userData = await callAPI({ action: 'login', empId: empId });
      
      // 更新使用者，但保留原本的單位
      currentUser.empId = userData.empId;
      currentUser.empName = userData.empName;
      
      bootstrap.Modal.getInstance(document.getElementById('changeUserModal')).hide();
      loadDashboard();
    }

    // ==========================================
    // 總覽首頁 (載入 Flow 清單)
    // ==========================================
    async function loadDashboard() {
      document.getElementById('user-info-display').innerText = `目前登入：${currentUser.empName} (${currentUser.empId}) - ${currentUser.department}`;
      switchPage('dashboard-page');
      
      const flows = await callAPI({ action: 'getFlows', department: currentUser.department, empId: currentUser.empId });
      const listContainer = document.getElementById('flow-list');
      listContainer.innerHTML = "";

      flows.forEach(flow => {
        const statusBadge = flow.isCompleted 
          ? `<span class="badge bg-success float-end">今日已完成</span>` 
          : `<span class="badge bg-warning text-dark float-end">待填寫</span>`;
        
        listContainer.innerHTML += `
          <button class="list-group-item list-group-item-action" onclick="loadFlow('${flow.flowId}', '${flow.flowName}')">
            <strong>${flow.flowName}</strong>
            ${statusBadge}
          </button>
        `;
      });
    }

    // ==========================================
    // 載入與渲染問卷題目
    // ==========================================
    async function loadFlow(flowId, flowName) {
      currentFlowId = flowId;
      document.getElementById('flow-title').innerText = flowName;
      switchPage('flow-page');
      
      currentQuestions = await callAPI({ action: 'getQuestions', flowId: flowId });
      const container = document.getElementById('questions-container');
      container.innerHTML = "";

      for (const q of currentQuestions) {
        let html = `<div class="card mb-3"><div class="card-body">
                      <h5 class="card-title">${q.title} <small class="text-muted">(${q.category})</small></h5>`;
        
        if (q.type === '單選') {
          q.options.forEach(opt => {
            html += `<div class="form-check">
                       <input class="form-check-input" type="radio" name="${q.qId}" value="${opt}">
                       <label class="form-check-label">${opt}</label>
                     </div>`;
          });
        } else if (q.type === '多選') {
          q.options.forEach(opt => {
            html += `<div class="form-check">
                       <input class="form-check-input" type="checkbox" name="${q.qId}" value="${opt}">
                       <label class="form-check-label">${opt}</label>
                     </div>`;
          });
        } else if (q.type === '數字' || q.type === '溫度') {
          let rangeText = (q.min !== null && q.max !== null) ? `(正常值範圍: ${q.min} ~ ${q.max})` : "";
          html += `<input type="number" step="0.1" class="form-control mb-2" id="${q.qId}" placeholder="請輸入數值 ${rangeText}">`;
          
          // 如果是溫度類型，準備畫布供 Chart.js 使用
          if (q.type === '溫度') {
            html += `<canvas id="chart-${q.qId}" width="400" height="150" class="mt-3"></canvas>`;
          }
        }
        
        html += `</div></div>`;
        container.innerHTML += html;
      }

      // 渲染完 DOM 後，針對溫度題目抓取歷史資料並繪圖
      for (const q of currentQuestions) {
        if (q.type === '溫度') {
          const history = await callAPI({ action: 'getHistory', qId: q.qId });
          renderChart(q.qId, q.title, history, q.min, q.max);
        }
      }
    }

    // ==========================================
    // 繪製溫度歷史折線圖
    // ==========================================
    function renderChart(qId, title, historyData, min, max) {
      const ctx = document.getElementById(`chart-${qId}`).getContext('2d');
      if (charts[qId]) charts[qId].destroy(); // 清除舊圖表

      const labels = historyData.map(d => d.date);
      const data = historyData.map(d => d.value);
      
      // 繪製正常值區間線
      let annotations = [];
      if(min !== null && max !== null) {
         annotations = [
           { type: 'line', yMin: min, yMax: min, borderColor: 'green', borderWidth: 2, borderDash: [5, 5] },
           { type: 'line', yMin: max, yMax: max, borderColor: 'red', borderWidth: 2, borderDash: [5, 5] }
         ];
      }

      charts[qId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{ label: title + ' (近7次紀錄)', data: data, borderColor: 'blue', tension: 0.1 }]
        },
        options: {
          responsive: true,
          plugins: { annotation: { annotations: annotations } } // 需額外引入 chartjs-plugin-annotation 才會有紅綠虛線，這裡簡化處理原生折線
        }
      });
    }

    // ==========================================
    // 送出問卷
    // ==========================================
    async function submitFlow() {
      let answers = [];
      
      for (const q of currentQuestions) {
        let value = "";
        let isException = false;

        if (q.type === '單選') {
          const checked = document.querySelector(`input[name="${q.qId}"]:checked`);
          if(checked) value = checked.value;
        } else if (q.type === '多選') {
          const checked = document.querySelectorAll(`input[name="${q.qId}"]:checked`);
          value = Array.from(checked).map(cb => cb.value).join(',');
        } else if (q.type === '數字' || q.type === '溫度') {
          value = document.getElementById(q.qId).value;
          if (value !== "") {
            const numVal = Number(value);
            // 判斷是否超出正常值範圍
            if ((q.min !== null && numVal < q.min) || (q.max !== null && numVal > q.max)) {
              isException = true;
            }
          }
        }
        
        if (value === "") return alert(`請完成題目: ${q.title}`);
        
        answers.push({ qId: q.qId, value: value, isException: isException });
      }

      const res = await callAPI({
        action: 'submitForm',
        empId: currentUser.empId,
        flowId: currentFlowId,
        answers: answers
      });

      if (res.exceptionTriggered) {
        alert("問卷已送出！\n注意：有數值超出正常區間，已自動通報異常處理。");
      } else {
        alert("問卷儲存成功！");
      }
      
      loadDashboard();
    }
  </script>
</body>
</html>
