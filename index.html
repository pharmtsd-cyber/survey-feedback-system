<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問卷回饋系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="desktop-mode">

  <div class="loading-overlay" id="loading"><div class="spinner-border text-primary" role="status"></div></div>

  <div id="login-page" class="page-view active container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow border-0">
          <div class="card-body p-5">
            <div class="text-center mb-4 text-primary"><i class="bi bi-ui-checks-grid" style="font-size: 3rem;"></i></div>
            <h3 class="text-center mb-4 fw-bold text-dark">問卷回饋系統</h3>
            <input type="text" id="login-emp-id" class="form-control form-control-lg mb-4 text-center fw-bold" placeholder="請輸入員工編號">
            <div class="d-grid gap-3">
              <button class="btn btn-outline-primary btn-lg fw-bold" onclick="app.login('desktop')"><i class="bi bi-pc-display me-2"></i>桌機版登入</button>
              <button class="btn btn-primary btn-lg fw-bold" onclick="app.login('mobile')"><i class="bi bi-phone me-2"></i>手機版登入</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="main-system" class="page-view" style="display:none;">
    <div id="wrapper">
      
      <!-- 側邊欄 -->
      <nav id="sidebar">
        <div class="sidebar-header d-flex flex-column align-items-center py-4" onclick="app.toggleSidebar()" style="cursor: pointer;" title="點擊展開/收合">
          <i class="bi bi-person-circle text-primary sidebar-icon mb-2 hover-scale"></i>
          <h5 class="fw-bold sidebar-text text-center w-100 mb-1">問卷回饋系統</h5>
          <small id="user-info" class="text-muted sidebar-text text-center w-100 fw-bold"></small>
        </div>
        
        <ul class="list-unstyled components">
          <li class="active"><a href="#" onclick="app.loadDashboard(this)"><i class="bi bi-house-door"></i> <span class="sidebar-text">系統總覽</span></a></li>
          
          <!-- 分類 1: 問卷類型 -->
          <li class="nav-header mt-3 px-3 text-secondary fw-bold sidebar-text small"><i class="bi bi-card-checklist me-1"></i>問卷類型 (所有單位)</li>
          <div id="dept-menu-container"></div>
          
          <!-- 分類 2: 後台維護 -->
          <li class="nav-header mt-3 px-3 text-secondary fw-bold sidebar-text small"><i class="bi bi-tools me-1"></i>後台維護</li>
          <li><a href="#" onclick="app.loadAdmin(this, 'flows')"><i class="bi bi-diagram-3"></i> <span class="sidebar-text">維護 FLOW</span></a></li>
          <li><a href="#" onclick="app.loadAdmin(this, 'questions')"><i class="bi bi-ui-checks"></i> <span class="sidebar-text">設計問卷</span></a></li>
        </ul>
      </nav>

      <!-- 主內容 -->
      <div id="content">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3 bg-white p-3 rounded shadow-sm border-0">
          <h4 id="page-main-title" class="fw-bold mb-0 text-dark">系統總覽</h4>
          <div class="d-flex align-items-center gap-2 bg-light px-3 py-2 rounded border" id="date-filter-container">
            <input type="date" id="start-date" class="form-control form-control-sm border-0 bg-transparent fw-bold text-primary" onchange="app.refreshCurrentPage()">
            <span class="text-muted fw-bold">~</span>
            <input type="date" id="end-date" class="form-control form-control-sm border-0 bg-transparent fw-bold text-primary" onchange="app.refreshCurrentPage()">
          </div>
        </div>

        <!-- 系統總覽 -->
        <div id="view-dashboard" class="content-view active">
          <div class="row">
            <div class="col-md-6 mb-3">
              <div class="card bg-danger text-white shadow-sm h-100 border-0">
                <div class="card-header border-0 fs-5"><i class="bi bi-exclamation-triangle"></i> 異常待處理 <span class="badge bg-light text-danger float-end fs-6 rounded-pill" id="dash-exc-count">0</span></div>
                <div class="card-body"><ul id="dash-exc-list" class="list-unstyled mb-0" style="max-height: 250px; overflow-y: auto;"></ul></div>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="card bg-warning text-dark shadow-sm h-100 border-0">
                <div class="card-header border-0 fs-5"><i class="bi bi-clock-history"></i> 未完成清單</div>
                <div class="card-body"><ul id="dash-inc-list" class="list-unstyled mb-0" style="max-height: 250px; overflow-y: auto;"></ul></div>
              </div>
            </div>
          </div>
          <h5 class="mt-4 fw-bold text-secondary"><i class="bi bi-graph-up"></i> 溫度監控折線圖</h5>
          <div id="dash-charts" class="row mt-2"></div>
        </div>

        <!-- 單位問卷清單 -->
        <div id="view-dept-flows" class="content-view">
          <div id="dept-accordion-container"></div>
        </div>

        <!-- 問卷填寫 -->
        <div id="view-form" class="content-view">
          <div id="form-container"></div>
          <div class="d-flex gap-2 mt-4 pb-4">
            <button class="btn btn-secondary flex-fill fw-bold shadow-sm py-2" onclick="app.goBack()">返回清單</button>
            <button class="btn btn-danger flex-fill fw-bold shadow-sm py-2" id="btn-delete-form" onclick="app.deleteRecord()" style="display:none;">刪除紀錄</button>
            <button class="btn btn-primary flex-fill fw-bold shadow-sm py-2" id="btn-submit-form" onclick="app.submitForm()">確認儲存</button>
          </div>
        </div>

        <!-- 後台維護 -->
        <div id="view-admin" class="content-view">
          <div class="alert alert-info shadow-sm mb-4"><i class="bi bi-info-circle"></i> 提示：目前為檢視模式。為確保資料庫關聯性，新增/刪除/編輯設定請前往 Google Sheets 原始檔操作。</div>
          <div id="admin-content-area"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
