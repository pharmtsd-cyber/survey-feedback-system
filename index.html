<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問卷回饋系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
</head>
<body class="desktop-mode">

  <div class="loading-overlay" id="loading"><div class="spinner-border text-primary" role="status"></div></div>

  <!-- 登入頁 -->
  <div id="login-page" class="page-view active container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow border-0">
          <div class="card-body p-5">
            <div class="text-center mb-4 text-primary"><i class="bi bi-ui-checks-grid" style="font-size: 3rem;"></i></div>
            <h3 class="text-center mb-4 fw-bold text-dark">問卷回饋系統</h3>
            <input type="text" id="login-emp-id" class="form-control form-control-lg mb-4 text-center fw-bold" placeholder="請輸入員工編號">
            <div class="d-grid gap-3">
              <button class="btn btn-outline-primary btn-lg fw-bold" onclick="app.login('desktop')"><i class="bi bi-pc-display me-2"></i>桌機版登入</button>
              <button class="btn btn-primary btn-lg fw-bold" onclick="app.login('mobile')"><i class="bi bi-phone me-2"></i>手機版登入</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="main-system" class="page-view" style="display:none;">
    <div id="wrapper">
      <!-- 側邊欄 -->
      <nav id="sidebar">
        <div class="sidebar-header d-flex flex-column align-items-center py-4" onclick="app.toggleSidebar()" style="cursor: pointer;">
          <i class="bi bi-person-circle text-primary sidebar-icon mb-2 hover-scale"></i>
          <h5 class="fw-bold sidebar-text text-center w-100 mb-1">問卷回饋系統</h5>
          <small id="user-info" class="text-muted sidebar-text text-center w-100 fw-bold"></small>
        </div>
        <ul class="list-unstyled components pb-4">
          <li class="active"><a href="#" onclick="app.dashboard.loadDashboard(this)"><i class="bi bi-house-door"></i> <span class="sidebar-text">系統總覽</span></a></li>
          <li><a href="#" onclick="app.calendar.loadCalendar(this)"><i class="bi bi-calendar-check"></i> <span class="sidebar-text">行事曆總覽</span></a></li>
          
          <li class="nav-header mt-3 px-3 text-secondary fw-bold sidebar-text small"><i class="bi bi-card-checklist me-1"></i>問卷類型 (各單位)</li>
          <div id="dept-menu-container"></div>
          
          <li class="nav-header mt-3 px-3 text-secondary fw-bold sidebar-text small"><i class="bi bi-tools me-1"></i>後台維護</li>
          <li><a href="#" onclick="app.admin.loadAdminFlows(this)"><i class="bi bi-diagram-3"></i> <span class="sidebar-text">維護 FLOW</span></a></li>
          <li><a href="#" onclick="app.admin.loadAdminQuestions(this)"><i class="bi bi-ui-checks"></i> <span class="sidebar-text">設計問卷題目</span></a></li>
        </ul>
      </nav>

      <!-- 主內容 -->
      <div id="content">
        <!-- 頂部控制區 -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3 bg-white p-3 rounded shadow-sm border-0">
          <h4 id="page-main-title" class="fw-bold mb-0 text-dark">系統總覽</h4>
          
          <div class="d-flex align-items-center gap-2 bg-light px-3 py-2 rounded border d-none" id="date-range-container">
            <input type="date" id="start-date" class="form-control form-control-sm border-0 bg-transparent fw-bold text-primary" onchange="app.refreshCurrentPage()">
            <span class="text-muted fw-bold">~</span>
            <input type="date" id="end-date" class="form-control form-control-sm border-0 bg-transparent fw-bold text-primary" onchange="app.refreshCurrentPage()">
          </div>
          
          <div class="d-flex align-items-center gap-2 bg-light px-3 py-2 rounded border d-none" id="date-single-container">
            <label class="fw-bold text-secondary mb-0">單日：</label>
            <input type="date" id="target-date" class="form-control form-control-sm border-0 bg-transparent fw-bold text-primary" onchange="app.refreshCurrentPage()">
          </div>
        </div>

        <!-- 系統總覽 -->
        <div id="view-dashboard" class="content-view active">
          <div class="row">
            <div class="col-md-6 mb-3">
              <div class="card bg-danger text-white shadow-sm h-100 border-0">
                <div class="card-header border-0 fs-5"><i class="bi bi-exclamation-triangle"></i> 異常待處理 <span class="badge bg-light text-danger float-end fs-6 rounded-pill" id="dash-exc-count">0</span></div>
                <div class="card-body p-2"><div class="accordion accordion-flush" id="acc-exceptions"></div></div>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="card bg-warning text-dark shadow-sm h-100 border-0">
                <div class="card-header border-0 fs-5"><i class="bi bi-clock-history"></i> 未完成清單</div>
                <div class="card-body"><ul id="dash-inc-list" class="list-unstyled mb-0" style="max-height: 250px; overflow-y: auto;"></ul></div>
              </div>
            </div>
          </div>
          <h5 class="mt-4 fw-bold text-secondary"><i class="bi bi-graph-up"></i> 溫度監控折線圖</h5>
          <div id="dash-charts" class="row mt-2"></div>
        </div>
        
        <!-- 行事曆總覽 -->
        <div id="view-calendar" class="content-view">
          <div class="card shadow-sm border-0 mb-4"><div class="card-body p-2 p-md-3" id="calendar-container"></div></div>
          <!-- 行事曆點擊後的下方詳細清單 -->
          <div id="calendar-details-container"></div>
        </div>

        <!-- 單位問卷清單 -->
        <div id="view-dept-flows" class="content-view">
          <div class="card bg-warning text-dark shadow-sm mb-4 border-0">
            <div class="card-header border-0 fw-bold fs-5"><i class="bi bi-exclamation-circle"></i> 本日未完成清單</div>
            <div class="card-body p-2"><ul id="dept-inc-list" class="list-unstyled mb-0"></ul></div>
          </div>
          <div id="dept-accordion-container"></div>
        </div>

        <!-- 問卷填寫 -->
        <div id="view-form" class="content-view">
          <div id="form-container"></div>
          <div class="d-flex gap-2 mt-4 pb-4">
            <button class="btn btn-secondary flex-fill fw-bold shadow-sm py-2" onclick="app.department.goBack()">返回清單</button>
            <button class="btn btn-danger flex-fill fw-bold shadow-sm py-2" id="btn-delete-form" onclick="app.department.deleteRecord()" style="display:none;">刪除紀錄</button>
            <button class="btn btn-primary flex-fill fw-bold shadow-sm py-2" id="btn-submit-form" onclick="app.department.submitForm()">確認儲存</button>
          </div>
        </div>

        <!-- 後台維護 FLOW -->
        <div id="view-admin-flows" class="content-view">
          <button class="btn btn-primary mb-3 shadow-sm fw-bold" onclick="app.admin.adminEditFlow(null)"><i class="bi bi-plus-lg"></i> 新增 FLOW</button>
          <div id="admin-flows-list"></div>
        </div>

        <!-- 後台維護 題目 -->
        <div id="view-admin-questions" class="content-view">
          <button class="btn btn-primary mb-3 shadow-sm fw-bold" onclick="app.admin.adminEditQuestion(null)"><i class="bi bi-plus-lg"></i> 新增題目</button>
          <div id="admin-questions-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal fade" id="adminModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow border-0">
        <div class="modal-header bg-light"><h5 class="modal-title fw-bold" id="adminModalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="adminModalBody"></div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary fw-bold" id="adminModalSaveBtn">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- 拆分後的 JS 檔案，請依序載入 -->
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/department.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
